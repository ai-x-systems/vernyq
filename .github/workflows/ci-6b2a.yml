name: CI - 6B-2A Validation

on:
  push:
    branches: ['**']
  workflow_dispatch: {}

jobs:
  validate:
    name: Validate (install, prisma:generate, typecheck, lint, test)
    runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Use Node.js 24
    uses: actions/setup-node@v4
    with:
      node-version: 24

  - name: Install dependencies
    run: npm install

  - name: Debug: confirm DIRECT_URL present (temporary)
    run: |
      if [ -z "$DIRECT_URL" ]; then
        echo "DIRECT_URL is empty"
        exit 1
      else
        echo "DIRECT_URL is set"
      fi

  - name: Prisma generate
    run: npm run prisma:generate

  - name: Typecheck
    run: npm run typecheck

  - name: Lint
    run: npm run lint

  - name: Run tests
    run: npm run test
